  <!-- Drum stripes -->
  <path d="M75 23 C70 35 73 47 77 50" stroke="currentColor" stroke-width="2.5" fill="none"/>
  <path d="M55 20 C48 33 52 47 57 52" stroke="currentColor" stroke-width="2.5" fill="none"/>
  <path d="M35 22 C30 32 33 42 37 47" stroke="currentColor" stroke-width="2.5" fill="none"/>

  <!-- Chute -->
  <rect x="11" y="22" width="12" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>

  <!-- Wheels -->
  <circle cx="98" cy="64" r="10" fill="currentColor"/>
  <circle cx="98" cy="64" r="4" fill="none"/>

  <circle cx="40" cy="64" r="10" fill="currentColor"/>
  <circle cx="40" cy="64" r="4" fill="none"/>
