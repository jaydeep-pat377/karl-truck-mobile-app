<svg width="120" height="80" viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cab -->
  <rect x="90" y="35" width="22" height="22" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <!-- Window -->
  <rect x="94" y="39" width="14" height="10" rx="1" fill="currentColor"/>

  <!-- Chassis -->
  <rect x="12" y="54" width="100" height="6" fill="currentColor"/>

  <!-- Drum -->
